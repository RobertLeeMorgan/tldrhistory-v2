name: Roll back staging

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Recover the known-good current release after a failed deployment, or roll back to the previous successful release.
        type: choice
        required: true
        options: [recover, rollback]

permissions:
  contents: read

concurrency:
  group: tldr-history-staging
  cancel-in-progress: false

jobs:
  rollback:
    runs-on: ubuntu-24.04
    environment: staging
    steps:
      - name: Prepare restricted SSH access
        env:
          DEPLOY_KEY: ${{ secrets.STAGING_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.STAGING_KNOWN_HOSTS }}
        shell: bash
        run: |
          install -m 700 -d "$RUNNER_TEMP/tldr-deploy"
          printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/tldr-deploy/id_ed25519"
          chmod 600 "$RUNNER_TEMP/tldr-deploy/id_ed25519"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/tldr-deploy/known_hosts"
          chmod 600 "$RUNNER_TEMP/tldr-deploy/known_hosts"
      - name: Roll back to the previous recorded release
        env:
          DEPLOY_HOST: ${{ secrets.STAGING_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STAGING_DEPLOY_USER }}
          OPERATION: ${{ inputs.operation }}
        shell: bash
        run: |
          [[ "$OPERATION" == "recover" || "$OPERATION" == "rollback" ]]
          ssh -i "$RUNNER_TEMP/tldr-deploy/id_ed25519" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/tldr-deploy/known_hosts" \
            -o ConnectTimeout=15 "$DEPLOY_USER@$DEPLOY_HOST" "$OPERATION"
      - name: Verify staging readiness
        env:
          STAGING_URL: ${{ vars.STAGING_URL }}
        shell: bash
        run: |
          response="$(curl --fail --silent --show-error --retry 12 --retry-connrefused \
            --retry-delay 5 --retry-all-errors --max-time 20 "$STAGING_URL/health/ready?recovery=$GITHUB_RUN_ID")"
          [[ "$response" == "tldr-history-ready" ]]
